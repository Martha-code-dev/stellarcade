name: Excluded crates report

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # `exclude` is only effective for crates absent from `members`. A crate
      # in both lists is built by CI but reported here as excluded, which made
      # session-nonce-manager and speed-trivia appear in both inventories.
      # Fail the job before generating a misleading report.
      - name: Validate workspace membership
        run: python3 scripts/validate_contract_workspace.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Print Rust toolchain versions
        run: |
          rustc -Vv
          cargo -V
          rustup show active-toolchain
        working-directory: ./contracts

      - name: Run excluded crates report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/excluded-crates-report.sh

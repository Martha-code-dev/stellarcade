name: Test Frontend App

on:
  push:
    branches: [main, develop, feat/*]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Web App
        run: pnpm --filter @stellarcade/web run typecheck

      - name: Run Web Unit Tests
        run: pnpm --filter @stellarcade/web run test

      - name: Build Web App
        run: pnpm --filter @stellarcade/web run build

      - name: Install Playwright Browsers
        run: pnpm --filter @stellarcade/web exec playwright install --with-deps

      - name: Run E2E Tests
        run: pnpm --filter @stellarcade/web exec playwright test

  # Tool tests run in their own matrix so a failing tool is visible by name
  # instead of being buried in the web job. tools/* come from the same
  # manifest-driven discovery used by lint.yml's build/typecheck matrix.
  discover-tools:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.discover.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover shipped tools
        id: discover
        run: echo "tools=$(node scripts/workspace_tools.mjs 2>/dev/null)" >> "$GITHUB_OUTPUT"

  test-tools:
    needs: discover-tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.discover-tools.outputs.tools) }}
    name: Test ${{ matrix.tool.name }}
    env:
      TOOL_NAME: ${{ matrix.tool.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile was not rewritten
        run: git diff --exit-code -- pnpm-lock.yaml
      # Run the tool's own locally installed vitest in one-shot mode. Passing
      # `--run` through `pnpm run test --` does not work for scripts declared
      # as bare `vitest` (pnpm turns it into `vitest -- --run`, a file filter),
      # and appending `run` to a script already declaring `vitest run` gives
      # `vitest run run`. `exec vitest run` is correct for both shapes.
      - name: Run tool tests
        run: pnpm --filter "$TOOL_NAME" exec vitest run

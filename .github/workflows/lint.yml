name: Lint Codebase

on: [pull_request]

permissions:
  contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies (lockfile)
        run: |
          cd backend
          if [ ! -f package-lock.json ] && [ ! -f npm-shrinkwrap.json ]; then
            echo "Backend lockfile is missing; refusing non-lockfile install" >&2
            exit 1
          fi
          npm ci
      - name: Run ESLint
        run: cd backend && npm run lint

  lint-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Print Rust toolchain versions
        run: |
          rustc -Vv
          cargo -V
          rustup show active-toolchain
      # Whole workspace, not a curated subset — a crate left off a hand
      # maintained list here is a crate that silently never gets linted.
      - name: Run Clippy (entire contracts workspace)
        run: cd contracts && cargo clippy --workspace --locked -- -D warnings
      # Formatting drift lands as noisy diffs for whoever touches the file
      # next, so fail the build on it. --all covers every workspace member
      # (and the path dependencies they pull in); `cargo fmt` without it
      # only checks the crate in the current directory.
      - name: Check formatting (entire contracts workspace)
        run: cd contracts && cargo fmt --all -- --check

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Web Lint
        run: pnpm --filter @stellarcade/web run lint

  # tools/* are pnpm workspace members. Discover them from pnpm-workspace.yaml
  # so a new tool is checked without editing this workflow. The script fails
  # on duplicate names or a missing lockfile importer (a frozen install would
  # otherwise rewrite pnpm-lock.yaml in CI).
  discover-tools:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.discover.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover shipped tools
        id: discover
        run: echo "tools=$(node scripts/workspace_tools.mjs 2>/dev/null)" >> "$GITHUB_OUTPUT"

  check-tools:
    needs: discover-tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.discover-tools.outputs.tools) }}
    name: Check ${{ matrix.tool.name }}
    env:
      TOOL_NAME: ${{ matrix.tool.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile was not rewritten
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Build tool
        run: pnpm --filter "$TOOL_NAME" run build
      - name: Typecheck tool
        run: pnpm --filter "$TOOL_NAME" exec tsc --noEmit

name: Contract Size

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/contract-size.mjs"

jobs:
  contract-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Print Rust toolchain versions
        run: |
          rustc -Vv
          cargo -V
          rustup show active-toolchain
        working-directory: ./contracts

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-size-${{ hashFiles('contracts/**/Cargo.toml') }}

      - name: Report contract wasm sizes
        run: node scripts/contract-size.mjs
